# Private Dokploy deployment. Load the image on the host before deploying.
# HTTPS is terminated by Cloudflare Tunnel, not by Dokploy/Traefik.
services:
  evolution-go:
    image: ${EVOLUTION_IMAGE:?Load the private image and set EVOLUTION_IMAGE}
    pull_policy: never
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      GLOBAL_API_KEY: "${GLOBAL_API_KEY:?Set a unique API key}"
      POSTGRES_AUTH_DB: "postgresql://evolution:${POSTGRES_PASSWORD:?Set a database password}@evolution-postgres:5432/evolution?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://evolution:${POSTGRES_PASSWORD:?Set a database password}@evolution-postgres:5432/evolution?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      # Explicit consent: persist credential-free events for desktop offline catch-up.
      PRIVATE_CHAT_HISTORY: "true"
      CLIENT_NAME: evolution
      OS_NAME: Linux
      GIN_MODE: release
      DEBUG_ENABLED: "0"
      LOG_TYPE: console
      CONNECT_ON_STARTUP: "true"
      # Pinned current WhatsApp Web revision (bundled whatsmeow default is outdated).
      WHATSAPP_VERSION_MAJOR: "2"
      WHATSAPP_VERSION_MINOR: "3000"
      WHATSAPP_VERSION_PATCH: "1052747707"
      WHATSAPP_AUTO_VERSION: "false"
      PASSKEY_PUBLIC_URL: https://evolutiongo.diogosrodrigues.com.br
      LOCAL_HTTP_ALLOWED_HOSTS: ""
      WEBHOOK_URL: ""
      WEBHOOK_FILES: "false"
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      API_AUDIO_CONVERTER: ""
      API_AUDIO_CONVERTER_KEY: ""
      MINIO_ENABLED: "false"
      PROXY_HOST: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      LOG_DIRECTORY: /app/logs
      LOG_MAX_SIZE: "10"
      LOG_MAX_BACKUPS: "2"
      LOG_MAX_AGE: "7"
    volumes:
      - app_data:/app/dbdata
      - app_logs:/app/logs
    depends_on:
      evolution-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/server/ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dokploy-network
      - database
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Unhealthy while a linked WhatsApp session is down. Kept out of
  # evolution-go's own healthcheck: Traefik stops routing to unhealthy
  # containers, which would also cut the reconnect endpoints.
  whatsapp-health:
    image: ${EVOLUTION_IMAGE:?Load the private image and set EVOLUTION_IMAGE}
    pull_policy: never
    restart: unless-stopped
    init: true
    entrypoint: ["sleep", "infinity"]
    depends_on:
      evolution-go:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://evolution-go:8080/server/whatsapp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    logging: *logging

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a database password}"
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  app_data:
  app_logs:
  postgres_data:

networks:
  dokploy-network:
    external: true
  database:
    internal: true
